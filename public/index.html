<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>🎂 Age Calculator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎂</text></svg>">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.css"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #0e1117;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      #loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #0e1117;
        color: #ffffff;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }
      .spinner {
        width: 50px;
        height: 50px;
        border: 4px solid rgba(255, 255, 255, 0.1);
        border-top-color: #ff4b4b;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .loader-text {
        font-size: 1.15rem;
        font-weight: 500;
        letter-spacing: 0.5px;
      }
      .loader-sub {
        font-size: 0.85rem;
        color: #a3a8b8;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <div id="loader">
      <div class="spinner"></div>
      <div class="loader-text">Loading Age Calculator...</div>
      <div class="loader-sub">Preparing Python WebAssembly runtime</div>
    </div>
    <div id="root"></div>

    <script type="module">
      import { mount } from "https://cdn.jsdelivr.net/npm/@stlite/browser/build/stlite.js";

      async function start() {
        try {
          const [appPy, ageLogicPy] = await Promise.all([
            fetch("./app.py").then((r) => r.text()),
            fetch("./age_logic.py").then((r) => r.text()),
          ]);

          mount(
            {
              entrypoint: "app.py",
              files: {
                "app.py": appPy,
                "age_logic.py": ageLogicPy,
              },
            },
            document.getElementById("root")
          );

          // Hide the initial loader once mounted
          const loader = document.getElementById("loader");
          if (loader) {
            setTimeout(() => {
              loader.style.opacity = "0";
              setTimeout(() => loader.remove(), 400);
            }, 600);
          }
        } catch (err) {
          console.error("Failed to mount app:", err);
          const loader = document.getElementById("loader");
          if (loader) {
            loader.innerHTML = `
              <div style="color: #ff4b4b; font-size: 1.2rem; font-weight: bold; margin-bottom: 8px;">⚠️ Failed to load app</div>
              <div style="color: #a3a8b8; max-width: 400px; text-align: center;">${err.message || err}</div>
            `;
          }
        }
      }

      start();
    </script>
  </body>
</html>
